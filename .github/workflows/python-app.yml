name: Python application

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Validate release branch
      if: ${{ github.ref_name != 'dev' }}
      run: |
        Write-Error "Manual release workflow must be run from the dev branch. Selected ref: $env:GITHUB_REF_NAME"
        exit 1
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Setup virtual environment
      run: |
        python -m venv ./venv/
    - name: Install dependencies
      run: |
        cd ./venv/Scripts/
        ./activate
        cd ../../
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Package
      run: |
        cd ./venv/Scripts/
        ./activate
        cd ../../
        ./build_global.bat
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        # A file, directory or wildcard pattern that describes what to upload
        # Required.
        path: |
          umalauncher/dist/UmaLauncher-Global.exe

        # The desired behavior if no files are found using the provided path.
        # Available Options:
        #   warn: Output a warning but do not fail the action
        #   error: Fail the action with an error message
        #   ignore: Do not output any warnings or errors, the action does not fail
        # Optional. Default is 'warn'
        if-no-files-found: error

        # If true, an artifact with a matching name will be deleted before a new one is uploaded.
        # If false, the action will fail if an artifact for the given name already exists.
        # Does not fail if the artifact does not exist.
        # Optional. Default is 'false'
        overwrite: true
    - name: Get release version
      id: release_version
      run: |
        $version_match = Select-String -Path "umalauncher/version.py" -Pattern '^VERSION = "([^"]+)"$'
        if (-not $version_match) {
          Write-Error "Could not find VERSION in umalauncher/version.py"
          exit 1
        }
        $version = $version_match.Matches[0].Groups[1].Value
        $tag = "v$version"

        git fetch --tags --force
        $existing_tag = git tag --list $tag
        if ($existing_tag) {
          Write-Host "Tag $tag already exists; skipping release creation."
          "release_exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        } else {
          "release_exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        }

        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
    - name: Create release tag
      if: ${{ steps.release_version.outputs.release_exists == 'false' }}
      run: |
        $tag = "${{ steps.release_version.outputs.tag }}"
        git tag $tag
        git push origin $tag
    - name: Create GitHub release
      if: ${{ steps.release_version.outputs.release_exists == 'false' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = "${{ steps.release_version.outputs.tag }}"
        gh release create $tag `
          "umalauncher/dist/UmaLauncher-Global.exe" `
          --verify-tag `
          --title $tag `
          --generate-notes
